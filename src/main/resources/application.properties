spring.application.name=smart-service-management-portal
server.port=8080
spring.datasource.url=jdbc:h2:mem:smartservice
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true

# Real email OTP (set these environment variables before running)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Optional sender address; if empty, your SMTP username is used by most providers
spring.mail.properties.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

